/* Layout: one viewport. The animation is the subject, centred. The name sits in the bottom-left corner. Black and white only. */
:root{ --bg:#ffffff; --ink:#000000; --gutter:clamp(20px,5vw,56px); color-scheme:light; }   /* light by default, whatever the system says */
:root[data-theme="dark"]{ --bg:#000000; --ink:#ffffff; color-scheme:dark; }
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Bagoss','Helvetica Neue',Helvetica,Arial,sans-serif}
.hero{position:relative;min-height:100%;display:grid;place-items:center;padding:var(--gutter)}
.mark{width:min(64vw,64vh,720px);aspect-ratio:1;max-width:100%}
.mark canvas{width:100%;height:100%;display:block}
.name,.mode{position:absolute;bottom:calc(var(--gutter) + env(safe-area-inset-bottom,0px));margin:0;font-weight:400;font-size:clamp(20px,2.2vw,30px);line-height:1;letter-spacing:-.015em}
.name{left:var(--gutter)}
.mode{right:var(--gutter);font:inherit;font-size:clamp(20px,2.2vw,30px);letter-spacing:-.015em;background:none;border:0;padding:0;color:var(--ink);cursor:pointer}
.mode:focus-visible{outline:2px solid var(--ink);outline-offset:6px}
.about{padding-inline:var(--gutter);padding-block:clamp(96px,18vh,200px) clamp(96px,18vh,160px);max-width:100%}
.about h2{margin:0;font-weight:400;font-size:clamp(30px,4.2vw,60px);line-height:1.05;letter-spacing:-.025em;max-width:18ch;text-wrap:balance}
.about .text{margin-top:clamp(32px,5vh,56px);max-width:36ch;display:grid;gap:1.2em;font-size:clamp(18px,1.5vw,22px);line-height:1.45;letter-spacing:-.005em}
.about p{margin:0}
</style>

<main class="hero">
  <div class="mark"><canvas id="hero-mark" width="640" height="640" role="img" aria-label="The Team Nebula mark, shifting between its four forms"></canvas></div>
  <h1 class="name">Team Nebula</h1>
  <button class="mode" id="mode" type="button" aria-pressed="false">Dark</button>
</main>

<section class="about">
  <h2>Ideas in. Stars out.</h2>
  <div class="text">
    <p>A nebula is a cloud of gas and dust with no fixed outline. Given time, it begins to form stars.</p>
    <p>Team Nebula works the same way. Hand us a brief or a half-formed idea and it stays in our cloud until it gives off a light of its own.</p>
  </div>
</section>

<script>
(function(){
  var root=document.documentElement, btn=document.getElementById('mode'), saved=null;
  try{ saved=localStorage.getItem('tn-theme'); }catch(e){}
  function apply(dark){
    if(dark) root.setAttribute('data-theme','dark'); else root.removeAttribute('data-theme');
    btn.textContent=dark?'Light':'Dark'; btn.setAttribute('aria-pressed',dark?'true':'false');
    btn.setAttribute('aria-label',dark?'Switch to light mode':'Switch to dark mode');
    window.dispatchEvent(new Event('tn-theme'));
  }
  apply(saved==='dark');
  btn.addEventListener('click',function(){
    var dark=root.getAttribute('data-theme')!=='dark'; apply(dark);
    try{ localStorage.setItem('tn-theme',dark?'dark':'light'); }catch(e){}
  });
})();
(function(){
  // ---------------------------------------------------------------------------
  // THE FOUR SIGNED-OFF SHAPES. Same generator as build_v7.py, so each rest
  // state is the artwork itself. Nothing else is ever held on screen.
  // ---------------------------------------------------------------------------
  var W=240, M=22, S=W-2*M, CX=120, CY=120;
  var SHAPES=[
    {name:'mark',  cells:4, R0:40, fill:0.46, mode:'cell', swell:0.2, sw:60, k:2.0},
    {name:'six',   cells:6, R0:40, fill:0.46, mode:'cell', k:1.6},
    {name:'seven', cells:7, R0:36, fill:0.45, mode:'node', size:'shrink', k:1.6},
    {name:'nine',  cells:9, R0:30, fill:0.46, mode:'node', size:'shrink', k:1.5}
  ];
  function lensParams(c){ return {R0:c.R0, k:c.k, swell:c.swell||0, sw:c.sw||1}; }
  function lensPt(L,x,y){
    var dx=x-CX, dy=y-CY, r=Math.hypot(dx,dy);
    if(r<1e-6) return [CX,CY-L.R0];
    var rp=Math.pow(Math.pow(r,L.k)+Math.pow(L.R0,L.k),1/L.k);
    rp*=1+L.swell*Math.exp(-(r/L.sw)*(r/L.sw));
    return [CX+dx*rp/r, CY+dy*rp/r];
  }
  function units(c){
    var pitch=S/c.cells, out=[], lo=c.mode==='node'?-1:0, hi=c.mode==='node'?c.cells+1:c.cells-1;
    for(var i=lo;i<=hi;i++) for(var j=lo;j<=hi;j++){
      var x=c.mode==='node'?M+i*pitch:M+(i+0.5)*pitch, y=c.mode==='node'?M+j*pitch:M+(j+0.5)*pitch;
      var d=Math.hypot(x-CX,y-CY)/(S/2), h=pitch*c.fill;
      if(c.size==='shrink') h*=1.2-1.0*d;
      if(h<pitch*0.17) continue;
      var cheb=Math.max(Math.abs(x-CX),Math.abs(y-CY))/pitch;
      out.push({x:x,y:y,h:h,ring:Math.round(cheb-0.5),ang:Math.atan2(y-CY,x-CX)});
    }
    return out;
  }
  function diamond(u){ return [[u.x,u.y-u.h],[u.x+u.h,u.y],[u.x,u.y+u.h],[u.x-u.h,u.y]]; }

  // ---------------------------------------------------------------------------
  // Geometry: half-plane clipping, centroid, and a radial outline sampled at a
  // shared set of angles so two convex pieces interpolate point for point.
  // ---------------------------------------------------------------------------
  function clip(poly,nx,ny,px,py,keepPositive){
    var out=[], n=poly.length;
    for(var i=0;i<n;i++){
      var a=poly[i], b=poly[(i+1)%n];
      var da=(a[0]-px)*nx+(a[1]-py)*ny, db=(b[0]-px)*nx+(b[1]-py)*ny;
      if(!keepPositive){ da=-da; db=-db; }
      if(da>=0) out.push(a);
      if((da>=0)!==(db>=0)){ var t=da/(da-db); out.push([a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t]); }
    }
    return out;
  }
  function centroid(poly){
    var A=0,cx=0,cy=0,n=poly.length;
    for(var i=0;i<n;i++){ var p=poly[i],q=poly[(i+1)%n],f=p[0]*q[1]-q[0]*p[1]; A+=f; cx+=(p[0]+q[0])*f; cy+=(p[1]+q[1])*f; }
    if(Math.abs(A)<1e-9){ var sx=0,sy=0; for(i=0;i<n;i++){sx+=poly[i][0];sy+=poly[i][1];} return [sx/n,sy/n]; }
    A*=0.5; return [cx/(6*A), cy/(6*A)];
  }
  function rayHit(poly,c,th){
    var dx=Math.cos(th), dy=Math.sin(th), best=0, n=poly.length;
    for(var i=0;i<n;i++){
      var a=poly[i], b=poly[(i+1)%n], ex=b[0]-a[0], ey=b[1]-a[1];
      var den=dx*ey-dy*ex; if(Math.abs(den)<1e-12) continue;
      var t=((a[0]-c[0])*ey-(a[1]-c[1])*ex)/den, s=((a[0]-c[0])*dy-(a[1]-c[1])*dx)/den;
      if(t>=0 && s>=-1e-9 && s<=1+1e-9 && t>best) best=t;
    }
    return best;
  }
  var N_UNIFORM=36;
  function angleSet(P0,P1,c0,c1){
    var set=[];
    for(var i=0;i<N_UNIFORM;i++) set.push(i*2*Math.PI/N_UNIFORM);
    P0.forEach(function(p){ set.push(Math.atan2(p[1]-c0[1],p[0]-c0[0])); });
    P1.forEach(function(p){ set.push(Math.atan2(p[1]-c1[1],p[0]-c1[0])); });
    set=set.map(function(a){ return (a%(2*Math.PI)+2*Math.PI)%(2*Math.PI); }).sort(function(a,b){return a-b;});
    var out=[]; set.forEach(function(a){ if(!out.length||a-out[out.length-1]>1e-6) out.push(a); });
    return out;
  }
  function radial(u){ var r=Math.hypot(u.x-CX,u.y-CY); return [(u.x-CX)/r,(u.y-CY)/r]; }
  function half(u,which){ var n=radial(u); return clip(diamond(u),n[0],n[1],u.x,u.y,which==='out'); }
  function piece(P0,P1,kind,ringFrom,ringTo){
    var c0=centroid(P0), c1=centroid(P1), ths=angleSet(P0,P1,c0,c1);
    return {c0:c0,c1:c1,ths:ths,kind:kind,ringFrom:ringFrom,ringTo:ringTo,
            r0:ths.map(function(t){return rayHit(P0,c0,t);}), r1:ths.map(function(t){return rayHit(P1,c1,t);})};
  }

  // ---------------------------------------------------------------------------
  // Transition A -> B, built in the direction where units multiply. Units that
  // have a counterpart travel whole. A unit that must feed new units is sliced
  // across the radial direction: the outer half is cut into one wedge per new
  // unit, the wedges become the new units, and the inner half regrows into the
  // whole unit. A transition that loses units is the same build played backwards.
  // ---------------------------------------------------------------------------
  function byRing(us){ var r=[]; us.forEach(function(u){ (r[u.ring]=r[u.ring]||[]).push(u); }); return r; }
  function angDist(a,b){ var d=Math.abs(a-b)%(2*Math.PI); return Math.min(d,2*Math.PI-d); }
  function angOff(from,to){ var d=to-from; while(d>Math.PI)d-=2*Math.PI; while(d<-Math.PI)d+=2*Math.PI; return d; }
  function nearestOne(u,list){
    var best=1e9, hit=null;
    list.forEach(function(v){ var d=angDist(u.ang,v.ang); if(d<best){best=d;hit=v;} });
    return hit;
  }
  function wedge(poly,u,k,i){                       // wedge i of k across the outer half, cut by rays from the unit centre
    if(k<=1) return poly;
    var n=radial(u), th=Math.atan2(n[1],n[0]), out=poly;
    var a0=th-Math.PI/2+Math.PI*i/k, a1=th-Math.PI/2+Math.PI*(i+1)/k;
    if(i>0)   out=clip(out,-Math.sin(a0),Math.cos(a0),u.x,u.y,true);
    if(i<k-1) out=clip(out,-Math.sin(a1),Math.cos(a1),u.x,u.y,false);
    return out;
  }
  function swirlAngle(r){ return (Math.PI/2)/(1+0.2*r); }   // travel per ring: 90 deg at the centre, barely tapering outward
  function shiftMap(ring,r){                        // each unit -> the unit a few slots along the ring; even rings go one way, odd rings the other
    var sorted=ring.slice().sort(function(p,q){return p.ang-q.ang;}), n=sorted.length, dir=r%2===0?1:-1, m=new Map();
    var slots=Math.max(1,Math.round(swirlAngle(r)/(2*Math.PI/n)));
    sorted.forEach(function(u,i){ m.set(u,sorted[((i+dir*slots)%n+n)%n]); });
    return m;
  }
  function build(A,B){
    var ra=byRing(A.units), rb=byRing(B.units), nA=ra.length, nB=rb.length, pieces=[];
    var shift=rb.map(function(ring,r){ return shiftMap(ring,r); });
    for(var r=0;r<nA;r++){
      var src=ra[r], tgt=rb[r], mate=new Map(), kids=new Map(), covered=new Set();
      src.forEach(function(a){ var b=nearestOne(a,tgt); mate.set(a,b); covered.add(b); kids.set(a,[]); });
      tgt.forEach(function(b){ if(!covered.has(b)) kids.get(nearestOne(b,src)).push(b); });
      if(r===nA-1) for(var rr=nA;rr<nB;rr++) rb[rr].forEach(function(b){ kids.get(nearestOne(b,src)).push(b); });
      src.forEach(function(a){
        var b=mate.get(a), ks=kids.get(a);
        b=shift[r].get(b);
        if(!ks.length){ pieces.push(piece(diamond(a),diamond(b),'whole',r,r)); return; }
        pieces.push(piece(half(a,'in'),diamond(b),'regrow',r,r));
        ks.sort(function(p,q){ return angOff(a.ang,p.ang)-angOff(a.ang,q.ang); });
        var outerHalf=half(a,'out');
        ks.forEach(function(kid,i){ var k2=shift[kid.ring].get(kid); pieces.push(piece(wedge(outerHalf,a,ks.length,i),diamond(k2),'slice',r,kid.ring)); });
      });
    }
    return {pieces:pieces, rings:nB};
  }
  function buildTransition(A,B){
    var rev=A.units.length>B.units.length;        // always build in the direction where units multiply
    var t=rev?build(B,A):build(A,B);
    t.rev=rev; t.L0=lensParams(A.cfg); t.L1=lensParams(B.cfg); return t;
  }

  // ---------------------------------------------------------------------------
  // Motion language (Premium, quickened): one curve, cubic-bezier(0.85,0,0.15,1).
  // Base unit 0.6s: hold 1.2s, move 1.5s. Every piece moves on the same curve
  // and lands at the same instant. Nothing turns as a body: every unit slides
  // along its ring by about the same angle the centre does (tapering outward),
  // even rings one way and odd rings the other, in one direction for the whole
  // move. Zero overshoot.
  // ---------------------------------------------------------------------------
  var HOLD=1.2, MOVE=1.5;
  function bezier(x1,y1,x2,y2){
    function cx(t){return 3*x1*t*(1-t)*(1-t)+3*x2*t*t*(1-t)+t*t*t;}
    function cy(t){return 3*y1*t*(1-t)*(1-t)+3*y2*t*t*(1-t)+t*t*t;}
    return function(x){ if(x<=0)return 0; if(x>=1)return 1; var lo=0,hi=1,t=x; for(var i=0;i<22;i++){ t=(lo+hi)/2; if(cx(t)<x) lo=t; else hi=t; } return cy(t); };
  }
  var ease=bezier(0.85,0,0.15,1);               // slow at both ends, very fast through the middle: the swap is a blink
  function clamp01(x){ return x<0?0:x>1?1:x; }

  var STATES=SHAPES.map(function(c){ return {cfg:c, units:units(c)}; });
  var TRANS=STATES.map(function(s,i){ return buildTransition(s, STATES[(i+1)%STATES.length]); });
  var SEG=HOLD+MOVE, LOOP=SEG*STATES.length;

  function drawUnits(ctx,state){
    var L=lensParams(state.cfg);
    state.units.forEach(function(u){
      var c=diamond(u); ctx.beginPath();
      for(var q=0;q<4;q++){ var a=c[q], b=c[(q+1)%4];
        for(var s=0;s<12;s++){ var p=lensPt(L,a[0]+(b[0]-a[0])*s/12, a[1]+(b[1]-a[1])*s/12);
          if(q===0&&s===0) ctx.moveTo(p[0],p[1]); else ctx.lineTo(p[0],p[1]); } }
      ctx.closePath(); ctx.fill();
    });
  }
  function drawTransition(ctx,T,v){                 // v: 0..1 raw progress of the move
    var g=ease(clamp01(v));
    var u=T.rev?1-g:g;                              // reversed builds run from their end state back to their start
    var L={R0:T.L0.R0+(T.L1.R0-T.L0.R0)*g, k:T.L0.k+(T.L1.k-T.L0.k)*g,
           swell:T.L0.swell+(T.L1.swell-T.L0.swell)*g, sw:T.L0.sw+(T.L1.sw-T.L0.sw)*g};
    T.pieces.forEach(function(P){
      var wx=P.c0[0]+(P.c1[0]-P.c0[0])*u, wy=P.c0[1]+(P.c1[1]-P.c0[1])*u;
      ctx.beginPath();
      for(var i=0;i<P.ths.length;i++){
        var r=P.r0[i]+(P.r1[i]-P.r0[i])*u, th=P.ths[i];
        var p=lensPt(L, wx+r*Math.cos(th), wy+r*Math.sin(th));
        if(i===0) ctx.moveTo(p[0],p[1]); else ctx.lineTo(p[0],p[1]);
      }
      ctx.closePath(); ctx.fill();
    });
  }
  function render(canvas,t){
    var ctx=canvas.getContext('2d');
    var dpr=Math.min(window.devicePixelRatio||1,2), css=canvas.clientWidth||640;
    if(canvas.width!==Math.round(css*dpr)){ canvas.width=canvas.height=Math.round(css*dpr); }
    var ink=getComputedStyle(document.documentElement).getPropertyValue('--ink').trim()||'#121a2b';
    ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,canvas.width,canvas.height);
    var s=canvas.width/240*0.9;
    ctx.setTransform(s,0,0,s,canvas.width/2-CX*s,canvas.height/2-CY*s);
    ctx.fillStyle=ink;
    t=(t%LOOP+LOOP)%LOOP;
    var i=Math.floor(t/SEG), u=t-i*SEG;
    if(u<HOLD) drawUnits(ctx,STATES[i]); else drawTransition(ctx,TRANS[i],(u-HOLD)/MOVE);
  }

  if(typeof window==='undefined'){ module.exports={STATES:STATES,TRANS:TRANS,byRing:byRing}; return; }
  var canvas=document.getElementById('hero-mark');
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var frozen=/^#t([\d.]+)$/.exec(location.hash);        // #t3.2 freezes the frame at 3.2s, for review
  if(frozen||reduce){
    var still=function(){ render(canvas,frozen?parseFloat(frozen[1]):0); };
    still(); window.addEventListener('resize',still); window.addEventListener('tn-theme',still); return;
  }
  var t0=performance.now();
  (function frame(now){ render(canvas,(now-t0)/1000); requestAnimationFrame(frame); })(t0);
})();

</script>
